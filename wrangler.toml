name = "dados"
main = "worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Four UTC invocations cover both EDT and EST.
# Worker code checks America/New_York and only refreshes at 07:00 or 19:00 local.
[triggers]
crons = ["0 11,12,23 * * *", "0 0 * * *"]

[vars]
GEMINI_MODEL = "gemini-3.8-flash"

# KV is best bound in the Cloudflare dashboard as:
# binding name: DADOS_KV
# namespace: dados-feed
